name: sbom refresh

# Dependabot's lockfile PRs failed `SBOM is current` every time, by
# construction: sbom/*.cdx.json is generated from Cargo.lock, Dependabot
# changes Cargo.lock and cannot run the generator, and nobody else can push
# to its branch before the check has already gone red (#522, #500, #485,
# #484, #483 on 2026-10-16). This job does the one thing a human did by
# hand each time — regenerate, commit, push — on the PR's own branch.
#
# `pull_request_target` because the push needs `contents: write`, which a
# `pull_request` run from Dependabot never has. That event runs with the
# base branch's permissions and checks out the PR head, so it is gated hard:
# the actor must be dependabot[bot] and the head must live in this
# repository. A fork can never reach the checkout, and Dependabot's commits
# contain a Cargo.lock change and nothing else.
#
# The push uses GH_PAT when it is set, because a push made with the
# workflow's own GITHUB_TOKEN does not start new workflow runs — the PR would
# carry fresh SBOMs and a stale red check. Without GH_PAT the refresh still
# lands and a maintainer re-runs the checks.
on:
  pull_request_target:
    branches: [main]
    paths:
      - Cargo.lock

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sbom-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Regenerate sbom/ for a Dependabot lockfile bump
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"

      # Dependabot branches off main at the time it opens the PR and does
      # not rebase on its own; a lockfile that merges cleanly with a newer
      # main can still describe a different closure than the merge result.
      # Bring main in first so the SBOMs match what would actually ship.
      # A conflict confined to sbom/ is not a conflict: every file there is
      # regenerated two steps down, so either side is a fine starting point.
      # It happens on the second refresh of one PR — the branch already
      # carries regenerated SBOMs and main has since changed its own (#522
      # on 2026-10-16, after #520 added two). A conflict anywhere else
      # (Cargo.lock itself) is a real one and fails the job.
      - name: Merge main into the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            conflicts=$(git diff --name-only --diff-filter=U)
            others=$(echo "$conflicts" | grep -v '^sbom/' || true)
            if [ -n "$others" ]; then
              echo "::error::conflicts outside sbom/ need a human: $others"
              exit 1
            fi
            git checkout --theirs -- sbom/
            git add sbom/
            git commit --no-edit
          fi

      - name: Regenerate sbom/
        run: scripts/generate-sbom.sh

      - name: Verify
        run: scripts/generate-sbom.sh --check

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/${{ github.event.pull_request.head.ref }})" ]; then
              echo "sbom/ already current; nothing to push"
              exit 0
            fi
          else
            git add sbom/
            git commit -m "chore(sbom): regenerate for the Dependabot lockfile bump" \
              -m "Generated by .github/workflows/sbom-refresh.yml from the merged Cargo.lock."
          fi
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
