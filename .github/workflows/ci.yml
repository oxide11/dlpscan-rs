name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# CI is read-only: fetches source, runs cargo build/test/clippy/fmt.
# Declaring the minimum token scope closes the CodeQL
# "Workflow does not contain permissions" finding and prevents a
# compromised action from escalating to write access.
permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove cargo registry overrides
        run: rm -f ~/.cargo/config.toml ~/.cargo/config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Remove cargo registry overrides
        run: rm -f ~/.cargo/config.toml ~/.cargo/config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --lib
      # Pattern/model lockstep. PatternDef.specificity and
      # .context_required in patterns/mod.rs must agree with
      # pattern_specificity() / is_context_required() in models.rs —
      # the scanner consults both, so a disagreement means one source
      # is lying and the admin-console catalog misreports scanner
      # behaviour. Cheap (no fixtures, runs in well under a second) and
      # previously ran in no workflow, which is how Malta TIN, Chile
      # RUN/RUT and Tanzania NIDA silently diverged.
      - name: Pattern/model lockstep audit
        run: cargo test --test audit_spec
      - name: Integration tests
        run: cargo test --test integration_test
      - name: Evasion tests
        run: cargo test --test evasion_test
      - name: Forensics tests
        run: cargo test --test forensics_test
      - name: Evadex regression tests
        run: cargo test --test evadex_regressions
      # Labelled-corpus recall + false-positive gate. Asserts 80/80 recall
      # across the positive corpus and zero forbidden matches across the
      # negatives. Was red on main for a long time — a GPS coordinate the
      # normalizer destroyed before matching, and a US phone whose validator
      # disagreed with the corpus — so it ran nowhere and detection
      # regressions had no automated signal. Both fixed; keep it green.
      - name: Detection quality (labelled corpus)
        run: cargo test --test detection_quality
      # Detection baselines against real public-record documents (legislative
      # directories of elected representatives). Unlike every other suite these
      # are documents we did not write, so they measure behaviour on real-world
      # formatting rather than on fixtures that encode what we already expected.
      # Several assertions pin known defects at today's numbers so they cannot
      # silently worsen; a failure here caused by *better* detection means the
      # baseline should be re-derived and raised.
      - name: Public records baselines
        run: cargo test --test public_records_test
      # The held-out corpus is too large for git (~49 MB here, ~600 MB for the
      # US one), so it is fetched and checksum-verified. Cached on the
      # committed SHA256SUMS.txt, which changes only when the corpus does.
      - name: Cache corpora
        uses: actions/cache@v4
        with:
          path: |
            tests/corpus/canada_contact_v1/*.csv
            tests/corpus/canada_contact_v1/*.jsonl
          key: corpora-${{ hashFiles('tests/corpus/*/SHA256SUMS.txt') }}
      - name: Fetch corpora
        # Absent SIPHON_CORPUS_BASE_URL the script reports what is missing and
        # exits 0, and the suite below skips rather than fails — so CI stays
        # green on a fork or before the bucket is configured, and starts
        # enforcing the moment the URL is set.
        env:
          SIPHON_CORPUS_BASE_URL: ${{ vars.SIPHON_CORPUS_BASE_URL }}
        run: scripts/fetch-corpus.sh
      # Per-label recall against a held-out corpus split (2,586 samples used
      # for nothing else). This is the only suite that can state a recall
      # figure rather than a pass/fail: labels.jsonl holds 80 positives over 73
      # sub-categories, roughly one example each. Floors sit below the measured
      # values; a failure means recall fell, and a rise means the baseline
      # should be re-derived and raised.
      - name: Held-out recall baselines
        run: cargo test --test held_out_recall_test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove cargo registry overrides
        run: rm -f ~/.cargo/config.toml ~/.cargo/config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --lib -- -D warnings -A dead-code -A unused-imports

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove cargo registry overrides
        run: rm -f ~/.cargo/config.toml ~/.cargo/config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt
      - run: cargo fmt --check

  version-sync:
    # Every place Siphon's version is declared — workspace crates,
    # ui/package.json, Helm appVersion, Helm image tag — must agree
    # with the root Cargo.toml. Runs on every push so a stale
    # Helm tag or a forgotten UI bump lands as a red check.
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-version-sync.sh

  ui:
    # Next.js static export + typecheck + lint. Runs on any change
    # so the SPA's type safety and bundle emit are verified every
    # push, independent of the Rust pipeline.
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
