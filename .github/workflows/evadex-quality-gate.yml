name: evadex quality gate

# Trigger paths cover every module that can move the detection or
# false-positive rate this gate measures.
#
# Two of them were previously wrong. `validation/**` matched nothing —
# validation is `validation.rs`, a file, so that entry silently covered
# zero changes for the life of the workflow. And `context/**` was absent
# entirely, though it holds the gating logic and the 5,000+ keyword table
# that decide whether ~30% of the pattern corpus runs at all: the module
# most able to change a detection rate without touching a pattern.
#
# `scoring.rs` is included for the same reason — the gate asserts on
# confidence thresholds, and scoring is what produces the confidences.
# (Duplicated rather than shared via a YAML anchor: GitHub Actions does not
# resolve anchors in workflow files. Keep the two lists in step.)
on:
  push:
    branches: [main]
    paths:
      - 'crates/siphon-core/src/normalize/**'
      - 'crates/siphon-core/src/patterns/**'
      - 'crates/siphon-core/src/scanner/**'
      - 'crates/siphon-core/src/context/**'
      - 'crates/siphon-core/src/validation.rs'
      - 'crates/siphon-core/src/scoring.rs'
      - '.github/workflows/evadex-quality-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/siphon-core/src/normalize/**'
      - 'crates/siphon-core/src/patterns/**'
      - 'crates/siphon-core/src/scanner/**'
      - 'crates/siphon-core/src/context/**'
      - 'crates/siphon-core/src/validation.rs'
      - 'crates/siphon-core/src/scoring.rs'
      - '.github/workflows/evadex-quality-gate.yml'
  workflow_dispatch:

# One run per ref. Without this every push started another ~2.5 h run and
# they accumulated: five were in flight at once during the 2026-09-04
# release wave. A superseded commit's verdict is not interesting.
concurrency:
  group: evadex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evadex-gate:
    # One job per submission strategy, each against its own threshold.
    #
    # The thresholds are each ~3.5 points under the figure the same scanner
    # measured on 2026-10-15/16 (siphon-core 2.11.0, evadex 3.41.1, this
    # seed): text 78.8%, docx 76.8%, xlsx 75.4%, pdf 63.3%, all with 0
    # errors. They are regression floors, not targets: a change that drops a
    # strategy below its floor has cost detection on that path and should say
    # why. Raise a floor when the number it guards has moved up and stayed.
    #
    # PDF sat 13-15 points below the other three on the same scanner, and
    # that was the fixture, not pdf-extract: evadex's PDF builder asked for
    # a font fpdf2 does not ship and fell back to Helvetica with Latin-1
    # `errors="replace"`, so every regional digit, zero-width character and
    # homoglyph reached Siphon as `?` (2,980 of the 3,534 variants detected
    # in text and missed in PDF on the 2026-10-15 run). evadex 3.42.0 embeds
    # the TrueType fonts it finds on the runner and leaves out of the pdf run
    # any variant no font can draw, counted under
    # `meta.skipped_unrepresentable`. The fonts step below is what gives it
    # something to find; without it the pdf job measures Latin-1 only. The
    # pdf floor (60) still dates from the broken fixture: re-derive it from
    # the first run on evadex >= 3.42.0 (expect the rate up and the total
    # down by the skipped variants), then raise it.
    #
    # The false-positive check runs once, on the text job: `evadex falsepos`
    # submits text whatever the strategy, so repeating it three more times
    # would measure the same thing.
    name: Run evadex quality gate (${{ matrix.strategy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - strategy: text
            min_detection: 75
            fp_args: >-
              --max-fp 5
              --fp-category credit_card --fp-category ssn --fp-category sin
              --fp-category iban --fp-category email --fp-category phone
              --fp-category ca_ramq
          - strategy: docx
            min_detection: 73
            fp_args: ""
          - strategy: pdf
            min_detection: 60
            fp_args: ""
          - strategy: xlsx
            min_detection: 72
            fp_args: ""
    # Was 180 min when the adapter paid scanner start-up once per test case
    # (2h05m–2h34m observed). With `batch: true` (evadex 3.41.0) one
    # `scan-dir` process serves a batch of submissions and the run is
    # dominated by building DOCX/PDF/XLSX fixtures in Python instead.
    timeout-minutes: 60

    steps:
      - name: Checkout dlpscan-rs
        uses: actions/checkout@v7

      - name: Checkout evadex
        uses: actions/checkout@v7
        with:
          repository: tbustenk/evadex
          path: evadex
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Siphon CLI (release)
        run: cargo build --release --bin siphon

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      # Fonts for the PDF fixture (evadex >= 3.42.0,
      # `evadex.adapters.dlpscan.pdf_fonts`). DejaVu Sans covers Latin,
      # Greek, Cyrillic, Arabic, Armenian, Georgian, Lao and N'Ko; GNU
      # FreeFont adds Devanagari, Bengali, Thai and more; Noto core adds the
      # rest of what the regional-digit techniques use that those two lack.
      # A script none of them covers is skipped for pdf and listed in the
      # report, never submitted as `?`. Cheap (a few MB) and only the pdf job
      # needs it, but the install is unconditional so the four jobs stay the
      # same image.
      - name: Install fonts for the PDF fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fonts-dejavu-core fonts-freefont-ttf fonts-noto-core

      - name: Install evadex
        working-directory: evadex
        run: pip install -e ".[dev]"

      - name: Run evadex unit tests
        working-directory: evadex
        run: python -m pytest tests/unit -q --tb=short

      # Until evadex 3.41.0 this step was the entire runtime of the job
      # (2h05m-2h34m): the adapter spawned one `siphon` per test case and
      # ~97% of the job was rebuilding the same 583 regexes and the keyword
      # automaton ~20,000 times (measured: scan-text on 28 bytes 0.395 s, of
      # which ~10 ms is scanning). `batch: true` below runs one `scan-dir`
      # over a batch of cases instead; verdicts are identical (720 of 720 on
      # a seeded comparison) and the job is now bounded by fixture building.
      #
      # `--seed` makes the keyword sentence wrapped around every submission
      # a pure function of (seed, category, value), so a red run here can
      # be reproduced locally with the same flag. Change the seed on purpose,
      # not by accident: it changes which sentences are tested.
      #
      # `--max-fp` is a real measurement as of evadex 3.41.0 (before that it
      # read a key the scan never wrote and passed unconditionally). The
      # `entropy` falsepos category submits random high-entropy strings,
      # which an entropy detector is meant to flag (7 of 10 flagged on
      # 2.10.0, every structured category at 0%), so the check is scoped to
      # the structured categories.
      #
      # `2>&1`: `evadex ci` prints its report to stderr. Without it the
      # uploaded artifact was a zero-byte file on every run since the
      # workflow was written.
      #
      # `set -o pipefail`: without it the step's exit status was `tee`'s,
      # never evadex's. Every run since the workflow was written printed
      # "One or more thresholds violated" (31.1% against a 70% threshold
      # on 2026-10-14) and the job went green. This gate has not gated.
      #
      # `strategy:` comes from the matrix. Before evadex 3.41.0 the file
      # strategies embedded the bare value with no keyword sentence, so
      # context-gated rules could not fire and DOCX/PDF/XLSX scored 9–20%
      # regardless of the scanner; the fixtures carry the sentence now and
      # the three file paths are gated on their own floors (see the job
      # comment). evadex 3.41.1 also leaves out of a DOCX/XLSX run the one
      # variant per category whose value XML cannot carry (`barcode_split`'s
      # U+001E marker) instead of recording 185 errors per strategy, which
      # is what `--max-error-rate 2` would otherwise be reading. evadex
      # 3.42.0 does the same for the pdf run with any variant the fixture
      # fonts cannot draw, and for tabs and control characters, which no
      # font can; the summary names the techniques.
      - name: Run evadex quality gate (siphon-cli adapter)
        working-directory: evadex
        env:
          SIPHON_BIN: ${{ github.workspace }}/target/release/siphon
        run: |
          # `evadex ci` selects the scanner from an evadex.yaml (tool + exe)
          # and forwards --config to the underlying `evadex scan`; thresholds
          # are on a 0-100 scale (--min-detection / --max-fp).
          set -euo pipefail
          cat > evadex.gate.yaml <<YAML
          tool: siphon-cli
          exe: ${SIPHON_BIN}
          batch: true
          strategy: ${{ matrix.strategy }}
          YAML
          # shellcheck disable=SC2086 — fp_args is a deliberate word list.
          python -m evadex ci \
            --config evadex.gate.yaml \
            --tier northam \
            --seed 20261015 \
            --concurrency 64 \
            --min-detection ${{ matrix.min_detection }} \
            --max-error-rate 2 \
            ${{ matrix.fp_args }} \
            2>&1 | tee evadex-gate-report.txt

      - name: Upload quality gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evadex-quality-gate-report-${{ matrix.strategy }}
          path: evadex/evadex-gate-report.txt
          if-no-files-found: ignore
          retention-days: 30
