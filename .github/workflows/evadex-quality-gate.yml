name: evadex quality gate

# Trigger paths cover every module that can move the detection or
# false-positive rate this gate measures.
#
# Two of them were previously wrong. `validation/**` matched nothing —
# validation is `validation.rs`, a file, so that entry silently covered
# zero changes for the life of the workflow. And `context/**` was absent
# entirely, though it holds the gating logic and the 5,000+ keyword table
# that decide whether ~30% of the pattern corpus runs at all: the module
# most able to change a detection rate without touching a pattern.
#
# `scoring.rs` is included for the same reason — the gate asserts on
# confidence thresholds, and scoring is what produces the confidences.
# (Duplicated rather than shared via a YAML anchor: GitHub Actions does not
# resolve anchors in workflow files. Keep the two lists in step.)
on:
  push:
    branches: [main]
    paths:
      - 'crates/siphon-core/src/normalize/**'
      - 'crates/siphon-core/src/patterns/**'
      - 'crates/siphon-core/src/scanner/**'
      - 'crates/siphon-core/src/context/**'
      - 'crates/siphon-core/src/validation.rs'
      - 'crates/siphon-core/src/scoring.rs'
      - '.github/workflows/evadex-quality-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/siphon-core/src/normalize/**'
      - 'crates/siphon-core/src/patterns/**'
      - 'crates/siphon-core/src/scanner/**'
      - 'crates/siphon-core/src/context/**'
      - 'crates/siphon-core/src/validation.rs'
      - 'crates/siphon-core/src/scoring.rs'
      - '.github/workflows/evadex-quality-gate.yml'
  workflow_dispatch:

# One run per ref. Without this every push started another ~2.5 h run and
# they accumulated: five were in flight at once during the 2026-09-04
# release wave. A superseded commit's verdict is not interesting.
concurrency:
  group: evadex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evadex-gate:
    name: Run evadex quality gate
    runs-on: ubuntu-latest
    # Was 180 min when the adapter paid scanner start-up once per test case
    # (2h05m–2h34m observed). With `batch: true` (evadex 3.41.0) one
    # `scan-dir` process serves a batch of submissions and the run is
    # dominated by building DOCX/PDF/XLSX fixtures in Python instead.
    timeout-minutes: 60

    steps:
      - name: Checkout dlpscan-rs
        uses: actions/checkout@v7

      - name: Checkout evadex
        uses: actions/checkout@v7
        with:
          repository: tbustenk/evadex
          path: evadex
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Siphon CLI (release)
        run: cargo build --release --bin siphon

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install evadex
        working-directory: evadex
        run: pip install -e ".[dev]"

      - name: Run evadex unit tests
        working-directory: evadex
        run: python -m pytest tests/unit -q --tb=short

      # Until evadex 3.41.0 this step was the entire runtime of the job
      # (2h05m-2h34m): the adapter spawned one `siphon` per test case and
      # ~97% of the job was rebuilding the same 583 regexes and the keyword
      # automaton ~20,000 times (measured: scan-text on 28 bytes 0.395 s, of
      # which ~10 ms is scanning). `batch: true` below runs one `scan-dir`
      # over a batch of cases instead; verdicts are identical (720 of 720 on
      # a seeded comparison) and the job is now bounded by fixture building.
      #
      # `--seed` makes the keyword sentence wrapped around every submission
      # a pure function of (seed, category, value), so a red run here can
      # be reproduced locally with the same flag. Change the seed on purpose,
      # not by accident: it changes which sentences are tested.
      #
      # `--max-fp` is a real measurement as of evadex 3.41.0 (before that it
      # read a key the scan never wrote and passed unconditionally). The
      # `entropy` falsepos category submits random high-entropy strings,
      # which an entropy detector is meant to flag (7 of 10 flagged on
      # 2.10.0, every structured category at 0%), so the check is scoped to
      # the structured categories.
      #
      # `2>&1`: `evadex ci` prints its report to stderr. Without it the
      # uploaded artifact was a zero-byte file on every run since the
      # workflow was written.
      #
      # `set -o pipefail`: without it the step's exit status was `tee`'s,
      # never evadex's. Every run since the workflow was written printed
      # "One or more thresholds violated" (31.1% against a 70% threshold
      # on 2026-10-14) and the job went green. This gate has not gated.
      #
      # `strategy: text`: the DOCX/PDF/XLSX strategies embed the bare value
      # with no keyword sentence, so context-gated rules cannot fire and
      # those strategies score 9–20% regardless of the scanner (text scores
      # 78.8% on the same run). Until evadex wraps file fixtures the same
      # way it wraps text, gating on them measures the fixture, not Siphon.
      - name: Run evadex quality gate (siphon-cli adapter)
        working-directory: evadex
        env:
          SIPHON_BIN: ${{ github.workspace }}/target/release/siphon
        run: |
          # `evadex ci` selects the scanner from an evadex.yaml (tool + exe)
          # and forwards --config to the underlying `evadex scan`; thresholds
          # are on a 0-100 scale (--min-detection / --max-fp).
          set -euo pipefail
          cat > evadex.gate.yaml <<YAML
          tool: siphon-cli
          exe: ${SIPHON_BIN}
          batch: true
          strategy: text
          YAML
          python -m evadex ci \
            --config evadex.gate.yaml \
            --tier northam \
            --seed 20261015 \
            --concurrency 64 \
            --min-detection 75 \
            --max-error-rate 2 \
            --max-fp 5 \
            --fp-category credit_card --fp-category ssn --fp-category sin \
            --fp-category iban --fp-category email --fp-category phone \
            --fp-category ca_ramq \
            2>&1 | tee evadex-gate-report.txt

      - name: Upload quality gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evadex-quality-gate-report
          path: evadex/evadex-gate-report.txt
          if-no-files-found: ignore
          retention-days: 30
