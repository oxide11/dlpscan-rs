# Cloudflare Tunnel overlay — puts the whole `auth` stack on a real hostname
# without opening a port on the host.
#
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml \
#                  --profile auth --profile tunnel up -d
#
# Why a tunnel rather than the Workers + Containers config in deploy/cloudflare:
# that one deploys siphon-api ALONE — a Worker in front of one container, five
# allowlisted API paths, no console, no Authelia, no Postgres. It is an API
# demo and cannot show you a UI or a login. The lab needs five services running
# together, which is this file.
#
# cloudflared dials OUT to Cloudflare and holds the connection open, so the VPS
# needs no inbound firewall rule and no public IP.
#
# The hop from cloudflared to nginx is **TLS as well**, not plaintext. It is a
# short hop over a compose bridge, but it carries session cookies and scan
# payloads — the sensitive data this product exists to find — and every other
# hop in this stack is already authenticated transport. nginx is TLS-only:
# there is no port 80 to fall back to, so a misconfigured ingress rule fails
# loudly instead of quietly downgrading. `nginx` still drops its host port
# binding here, because with a tunnel in front publishing it is a second way
# in that bypasses Cloudflare entirely.
#
# Read alongside docs/getting-started/lab.md, which covers the Cloudflare-side
# setup this file assumes: a named tunnel, its token, and two public hostnames
# both routed to **https://nginx:443**.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    # A remotely-managed tunnel: the ingress rules live in the Cloudflare
    # dashboard rather than in a config file here, so adding a hostname does
    # not mean redeploying the stack. --no-autoupdate because an unattended
    # binary swap under a lab is a variable you did not choose to change.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN — see docs/getting-started/lab.md}
    depends_on:
      - nginx
    # No `networks:` key — the base file names the default network `siphon-net`
    # and every service joins it implicitly. Declaring a network here would
    # have to repeat that name, and a second name is a second thing to keep in
    # step; cloudflared reaches nginx as `https://nginx:443` either way.
    #
    # It only needs outbound 443. No ports, no volumes, no secrets on disk.

  nginx:
    # Overrides the base file's "8443:443". With the tunnel in front, the host
    # port is redundant and would bypass Cloudflare entirely. Reachable from
    # cloudflared as https://nginx:443.
    ports: !override []

  authelia:
    # The committed configuration.yml is hardcoded to siphon.local — ten
    # occurrences across access_control, session and the redirect URL, and a
    # session cookie scoped to the wrong domain silently fails to authenticate
    # rather than erroring. scripts/dev/lab-setup.sh renders a copy with your
    # real domain; this mounts that copy over the original.
    volumes:
      - ./authelia:/config
      - ./authelia/configuration.lab.yml:/config/configuration.yml:ro
      - authelia-data:/config/runtime
