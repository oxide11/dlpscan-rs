# Siphon reverse proxy — routes every request through Authelia
# forward-auth before it reaches siphon-api or siphon-fs.
#
# Layout:
#   /auth/*    → authelia:9091           (login UI, OIDC endpoints)
#   /api/*     → siphon-api:8080         (scan, batch, tokenize, admin)   mTLS
#   /fs/*      → siphon-fs:8081          (file upload + extract)          mTLS
#   /ir-legacy/* → the old IR wireframe (baked in at /srv/ir-legacy)
#   /          → the analyst console SPA (built from console/, at /srv/console)
#
# The two service hops are MUTUAL TLS. nginx verifies siphon-api and
# siphon-fs against the deployment CA and presents its own client
# certificate, which each service requires (SIPHON_TLS_CLIENT_CA /
# SIPHON_FS_TLS_CLIENT_CA). A pod that can reach siphon-api's port is
# therefore not nginx unless it also holds nginx's key — which is what makes
# the `Remote-*` identity headers below trustworthy at the far end, on top
# of SIPHON_TRUSTED_PROXIES. The material is mounted at
# /etc/nginx/certs/internal/{client.crt,client.key,ca.crt}; see
# scripts/dev/mkcerts.sh and docs/architecture/api-keys.md §9.
#
# Authelia is not a detector and holds no data; that hop stays plaintext
# inside the pod network.
#
# Forward-auth pattern:
#   Nginx calls Authelia's /api/verify on every request. If Authelia
#   says "unauthenticated", Nginx 302s to the Authelia login portal
#   with rd= set to the original URL. On success, Authelia replies
#   with Remote-User / Remote-Groups / Remote-Email headers which we
#   pass through to siphon-api so it can run RBAC against the user's
#   groups instead of (or alongside) API-key role mapping.
#
# TLS is terminated here in prod — the `ssl_*` block below is ready
# to uncomment once certs are mounted at /etc/nginx/certs/.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # --- hygiene ---------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    server_tokens off;

    # Upload size cap — siphon-fs accepts multipart files. Keep this
    # in sync with SIPHON_FS_MAX_BODY_BYTES; the smaller of the two
    # wins.
    client_max_body_size 50m;

    # --- mime + logs -----------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # JSON access log — easier for SIEM forwarders to parse than the
    # combined format.
    log_format json escape=json
        '{"ts":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt_ms":$request_time,'
        '"upstream_rt_ms":"$upstream_response_time",'
        '"user":"$authelia_user",'
        '"groups":"$authelia_groups",'
        '"ua":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json;
    error_log  /var/log/nginx/error.log warn;

    # --- gzip -----------------------------------------------------------
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml;

    # --- upstreams ------------------------------------------------------
    # Hostnames here match the Service names the Helm chart emits
    # for a release named `siphon` (fullname collapses to `siphon`
    # and componentName is `siphon-<comp>`). The upstream names are
    # intentionally different from the internal location paths so
    # nginx directive lookups stay unambiguous.
    upstream authelia {
        server siphon-authelia:9091;
        keepalive 16;
    }

    upstream siphon_api {
        server siphon-api:8080;
        keepalive 32;
    }

    upstream siphon_fs {
        server siphon-fs:8081;
        keepalive 16;
    }

    # --- upstream mutual TLS ------------------------------------------
    # Applies to every `proxy_pass https://` in this file; the plaintext
    # Authelia hop ignores it. `proxy_ssl_verify on` is the half people
    # forget: without it nginx encrypts to whatever answers on the port.
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    proxy_ssl_certificate         /etc/nginx/certs/internal/client.crt;
    proxy_ssl_certificate_key     /etc/nginx/certs/internal/client.key;
    proxy_ssl_trusted_certificate /etc/nginx/certs/internal/ca.crt;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    proxy_ssl_server_name         on;
    proxy_ssl_session_reuse       on;

    # --- helper variables captured from Authelia's forward-auth reply ---
    # Nginx can't read headers from a sub-request directly, so we
    # stash them in variables via the auth_request_set directive.
    # These feed both the access log and the proxied request.
    map $upstream_http_remote_user     $authelia_user   { default ""; ~(.+) $1; }
    map $upstream_http_remote_groups   $authelia_groups { default ""; ~(.+) $1; }
    map $upstream_http_remote_email    $authelia_email  { default ""; ~(.+) $1; }

    # --- pick the browser-facing host for X-Original-URL ----------
    # Codespaces' port forwarder rewrites the request `Host:` to
    # `localhost` on the way through to the cluster, but preserves
    # the original hostname in `X-Forwarded-Host`. Authelia matches
    # the request URL against its session.cookies[*].domain values
    # and refuses to apply `default_policy: bypass` if the host
    # doesn't match — so handing it the localhost-based URL turns
    # every auth_request into a 401 → 302 to /auth/, breaking the
    # SPA shell, the API, and any other auth-gated path.
    #
    # Prefer the X-Forwarded-Host when present (codespaces, any
    # standards-compliant reverse proxy), fall back to the literal
    # Host header otherwise (direct browser → nginx, no proxy).
    map $http_x_forwarded_host $authelia_browser_host {
        default $http_host;
        "~.+"   $http_x_forwarded_host;
    }

    server {
        # TLS only. There is no plaintext listener at all — not a port 80
        # that redirects, which still accepts the connection and reads a
        # request line before saying no. A client that speaks plaintext here
        # gets connection refused.
        #
        # This is a hop the rest of the stack already treats as sensitive:
        # every detector <-> C2/database hop is mutually authenticated, and
        # nginx presents a client certificate upstream to siphon-api and
        # siphon-fs. What it did NOT do until now is present one downstream,
        # so the last hop into the ingress — cloudflared to nginx, or a
        # browser to nginx in local dev — carried session cookies and scan
        # payloads in the clear. The 443 block sat commented out because
        # there was no server certificate to put in it; mkcerts.sh now mints
        # nginx/tls.{crt,key} with serverAuth and a SAN covering `nginx` and
        # `localhost`.
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name siphon.local;

        # No HTTP/2. cloudflared speaks HTTP/1.1 to the origin, and a browser
        # in local dev is one client on a loopback port, so h2 buys nothing
        # here — while `http2 on;` is nginx 1.25+ syntax and
        # scripts/validate-nginx.sh runs against whatever nginx the machine
        # has (1.24 on the current image). A directive the shipped nginx
        # accepts and the validator cannot parse means the gate stops
        # checking this file at all, which costs more than h2 gains.

        ssl_certificate     /etc/nginx/certs/internal/tls.crt;
        ssl_certificate_key /etc/nginx/certs/internal/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Send redirects as relative URIs (e.g. `Location: /`)
        # rather than nginx's default of promoting them to absolute
        # URIs using the request `Host` header. Codespaces' port
        # forwarder rewrites the Host on the way through to the
        # cluster, so an absolute redirect ends up as
        # `http://localhost/` and the browser tries to reach a
        # nonexistent local server. Relative redirects let the
        # browser resolve them against the original codespace URL.
        absolute_redirect off;

        # Security headers — apply to every response. Nginx is the
        # single ingress, so these don't need to be repeated in
        # siphon-api.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # Safe to send now that this listener is TLS-only. It would have been
        # ignored over plaintext (RFC 6797), which is why siphon-fs still
        # omits it — see CLAUDE.md, Security.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # --- forward-auth sub-request ----------------------------------
        # Internal location that Nginx hits before every protected
        # request. Authelia's /api/verify returns 200 when the
        # request is authenticated and 401 (or 302 for browser flows)
        # otherwise.
        # Satisfy-either: a valid bearer key OR an Authelia session.
        #
        # Two kinds of caller reach /api/. Humans arrive from the console with
        # an Authelia session cookie. Machines — the CLI, CI jobs, the evadex
        # bridge — carry `Authorization: Bearer <SIPHON_API_KEY>` and have no
        # cookie, so gating them on Authelia would 302 every JSON call to the
        # login page. That is why /api/ carried no auth_request at all, which
        # in turn meant Authelia's per-group rules never ran.
        #
        # So: a bearer token short-circuits to 204 and siphon-api validates the
        # key itself; everything else goes to Authelia. `if` with a bare
        # `return` is the one form of `if` in a location that is well-defined.
        location = /internal/authz {
            internal;
            if ($http_authorization ~* "^Bearer .+") {
                return 204;
            }
            proxy_pass http://authelia/api/verify;
            proxy_set_header X-Original-URL   https://$authelia_browser_host$request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header Content-Length   "";
            proxy_pass_request_body           off;
        }

        location = /internal/authelia/authz {
            internal;
            proxy_pass http://authelia/api/verify;
            # Authelia refuses any X-Original-URL whose scheme isn't
            # https/wss as a session-cookie-integrity guard (401 with
            # "Target URL ... has an insecure scheme"). Inside the
            # cluster Nginx serves plaintext, so $scheme is always
            # http — force https here. The URL is only consumed by
            # Authelia's access_control rule matcher; nothing connects
            # to it, so the scheme is a label, not a request target.
            proxy_set_header X-Original-URL   https://$authelia_browser_host$request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header Content-Length   "";
            proxy_pass_request_body           off;
        }

        # --- /auth/* → Authelia (login UI, OIDC, password reset) -------
        location /auth/ {
            proxy_pass http://authelia/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- /api/* → siphon-api (scan, tokenize, admin) --------------
        # Gated by /internal/authz, which accepts either a bearer key or
        # an Authelia session — see that location for why both.
        #
        # This gate used to be absent, which meant every access_control rule
        # Authelia declares for `^/api/...` (admins-only overrides, operators
        # for scan) was dead configuration: the request went straight through
        # and siphon-api granted Admin to any holder of the shared key. The
        # rules run now, and siphon-api derives the role from the identity
        # forwarded below rather than from the mere fact of a valid key.
        location /api/ {
            auth_request /internal/authz;

            # Capture the identity Authelia asserted. On the bearer path the
            # sub-request returns 204 with no such headers, so these resolve
            # empty and nginx omits them entirely — siphon-api then falls back
            # to key auth, which is the intended behaviour for machines.
            auth_request_set $rw_user   $upstream_http_remote_user;
            auth_request_set $rw_groups $upstream_http_remote_groups;
            auth_request_set $rw_email  $upstream_http_remote_email;

            # SECURITY: these three `proxy_set_header` lines are the only
            # source of Remote-* on the upstream request. A client-supplied
            # `Remote-Groups: admins` is overwritten here, not forwarded.
            # siphon-api additionally refuses to believe these headers unless
            # the TCP peer is in SIPHON_TRUSTED_PROXIES — neither guard is
            # sufficient alone, because this one dies the moment anything
            # reaches siphon-api without passing through nginx.
            proxy_set_header Remote-User   $rw_user;
            proxy_set_header Remote-Groups $rw_groups;
            proxy_set_header Remote-Email  $rw_email;

            proxy_pass https://siphon_api/;
            # The name the upstream certificate must carry (its SAN), not the
            # browser's Host — nginx would otherwise verify siphon-api's
            # certificate against "siphon.example" and fail every request.
            proxy_ssl_name siphon-api;
            # Upstream keepalive needs HTTP/1.1 and an empty Connection
            # header; with a TLS handshake per connection this stops being
            # a nicety.
            proxy_http_version 1.1;
            proxy_set_header Connection           "";
            proxy_set_header Host                 $host;
            proxy_set_header X-Real-IP            $remote_addr;
            proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto    $scheme;
        }

        # --- /fs/* → siphon-fs (multipart file scan) ------------------
        # Same bearer-vs-session reasoning as /api/ above: siphon-fs validates
        # SIPHON_API_KEY itself, so no Authelia gate here.
        #
        # NB that claim was false until 2026-09-02. siphon-fs had no
        # authentication of any kind — POST /scan accepted uploads, GET
        # /v1/findings returned previously scanned findings, and POST
        # /v1/overrides/reload mutated detection config, all uncredentialed —
        # so this location was an unauthenticated path to the scanner and to
        # other people's data. The bearer check now exists and this comment
        # describes something real. Re-verify before relaxing it again.
        location /fs/ {
            # siphon-fs streams large uploads — disable Nginx's
            # default response buffering so the connection isn't
            # held open while the full response is spooled to disk.
            proxy_request_buffering off;
            proxy_buffering         off;

            proxy_pass https://siphon_fs/;
            proxy_ssl_name siphon-fs;
            proxy_http_version 1.1;
            proxy_set_header Connection           "";
            proxy_set_header Host                 $host;
            proxy_set_header X-Real-IP            $remote_addr;
            proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto    $scheme;
        }

        # --- /ir-legacy/ → the old IR wireframe ------------------------
        # Single-file React app, kept as a reference while the console's
        # own IR surface fills in. CSS / JS is inlined at sync time
        # (docs/wireframes/sync-shared.sh); only siphon-logo.png is
        # external.
        #
        # It used to sit at /ir/, which the console now owns. A prefix
        # location beats `location /`, so /ir/ served this wireframe and
        # /ir/alerts — the IR queue — looked for a file at /srv/ir/alerts
        # and 404'd, with no SPA fallback here to catch it. Every IR deep
        # link was dead in a deployed image while the routes existed and
        # passed their own tests. The console's own /detections link was
        # covered below; nothing asked the same question of /ir.
        location /ir-legacy/ {
            alias /srv/ir-legacy/;
            index index.html;
        }

        # --- /ui/ → gone, redirected ---------------------------------
        # The wireframe consoles used to live here. Bookmarks and the
        # lab README outlive a rename, so this redirects rather than
        # 404s.
        location /ui/ {
            return 301 /;
        }

        # --- / → the analyst console (SPA) ---------------------------
        # Built from console/ in the image's first stage.
        #
        # `try_files ... /index.html` is load-bearing: the console's routes
        # (/findings, /scan, …) are real URLs owned by the client router, so
        # a refresh or a pasted deep link arrives here as a request for a
        # file that does not exist. Without the fallback every shared URL
        # 404s — and "URL state, not component state" is the whole point of
        # the routing design.
        #
        # Hashed asset filenames never change contents, so they cache hard;
        # the HTML entry point must not, or a deploy leaves browsers on the
        # old document pointing at assets that no longer exist.
        #
        # Caching is set with `expires`, deliberately NOT `add_header
        # Cache-Control`. An `add_header` at this level would cancel
        # inheritance of the four security headers declared on the server
        # block — nginx only inherits them into a location that declares none
        # of its own — silently stripping X-Frame-Options and nosniff from
        # the console's HTML, which is the one response where they matter
        # most. `expires` sets Cache-Control without touching inheritance.
        location / {
            root /srv/console;
            try_files $uri $uri/ /index.html;

            location ~* \.(?:js|css|png|jpe?g|svg|woff2?)$ {
                root /srv/console;
                expires 1y;
            }
        }

        location = /index.html {
            root /srv/console;
            expires -1;
        }

        # --- health/metrics (unauthenticated, internal only) ----------
        # Exposed so Kubernetes / Docker can probe the proxy without
        # a bearer token, but scoped to internal networks by allow-
        # listing RFC1918 CIDRs.
        location = /nginx-health {
            access_log off;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1/32;
            deny all;
            return 200 "ok\n";
        }
    }
}
