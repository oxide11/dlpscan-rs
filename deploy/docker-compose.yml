version: '3.8'

# ---------------------------------------------------------------------------
# Siphon compose stack.
#
# Top-half: the CLI / scanner / guard containers (the original lab
# wiring).
#
# Bottom-half (siphon-api + siphon-fs + authelia + nginx): the Phase 2
# "zero-trust" front door. Nginx terminates every request and checks
# it against Authelia (OIDC + Passkeys) before routing to siphon-api
# or siphon-fs. Everything is on the `siphon-net` bridge so service
# names resolve via Docker DNS.
#
# Bring the auth stack up with:
#
#   docker compose -f deploy/docker-compose.yml \
#     --profile auth up --build
#
# The CLI containers stay in the default profile so plain
# `docker compose up` keeps today's behaviour.
# ---------------------------------------------------------------------------

services:
  dlpscan:
    build:
      # Compose lives in deploy/, but the Dockerfile copies
      # Cargo.toml + crates/ + src/ from the repo root, so the
      # build context has to be the parent dir. Matches the same
      # pattern siphon-api / siphon-fs / siphon-nginx use below.
      context: ..
      dockerfile: deploy/Dockerfile
    image: dlpscan:latest
    container_name: dlpscan
    volumes:
      - ./data:/data:ro
    environment:
      - RUST_LOG=info
    command: ["scan-dir", "/data", "--format", "json"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Scan a single file
  dlpscan-file:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: dlpscan:latest
    profiles:
      - tools
    volumes:
      - ./data:/data:ro
    command: ["scan", "/data/input.txt"]

  # Run with InputGuard in redact mode
  dlpscan-guard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: dlpscan:latest
    profiles:
      - tools
    environment:
      - RUST_LOG=info
    command: ["guard", "--action", "redact", "--presets", "pci-dss,credentials"]

  # evadex — adversarial testing bridge. FastAPI service that drives
  # evadex runs from siphon-c2 and exposes /v1/evadex/{run,metrics,generate}.
  # Builds from the sibling evadex repo (../evadex), so both checkouts
  # need to live under the same parent directory for `docker compose up`.
  evadex:
    build:
      # Relative to the repo root — matches the sibling dlpscan services
      # above. Assumes the evadex checkout lives next to dlpscan-rs so
      # `docker compose -f deploy/docker-compose.yml up` from the repo
      # root can find ../evadex.
      context: ../evadex
      dockerfile: deploy/Dockerfile.bridge
    image: evadex:latest
    container_name: evadex
    environment:
      # Leave EVADEX_BRIDGE_KEY unset for trusted-network dev; set it
      # in .env or via shell to require x-api-key on every request.
      - EVADEX_BRIDGE_KEY=${EVADEX_BRIDGE_KEY:-}
      - SIPHON_EXE=/usr/local/bin/siphon
      - EVADEX_BRIDGE_ROOT=/results
    volumes:
      - evadex-results:/results
    ports:
      - "8081:8081"
    depends_on:
      - dlpscan
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------------------
  # Phase 2 — zero-trust front door
  # -------------------------------------------------------------------------
  siphon-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: siphon-api:2.12.0
    profiles: [auth]
    environment:
      # siphon-api reads SIPHON_BIND + SIPHON_PORT separately, never
      # a combined SIPHON_API_BIND. Default bind is 127.0.0.1 which
      # makes the container unreachable from nginx — force 0.0.0.0
      # explicitly, matching the Helm chart.
      - SIPHON_BIND=0.0.0.0
      - SIPHON_PORT=8080
      # `${SIPHON_API_KEY:-}` expands to an empty string when the variable is
      # absent, and siphon-api now treats empty as unset and refuses to start
      # rather than silently accepting `Authorization: Bearer ` with nothing
      # after it — which is what the previous behaviour did while logging
      # "API key authentication enabled".
      #
      # So either export a key:
      #     export SIPHON_API_KEY="$(openssl rand -hex 32)"
      # or opt in explicitly to running without authentication, which is only
      # reasonable because Nginx + Authelia are the real front door here:
      #     export SIPHON_ALLOW_UNAUTHENTICATED=true
      - SIPHON_API_KEY=${SIPHON_API_KEY:-}
      - SIPHON_ALLOW_UNAUTHENTICATED=${SIPHON_ALLOW_UNAUTHENTICATED:-}
      # --- identity: mutual TLS on both hops -------------------------------
      # The listener requires a client certificate from the deployment CA,
      # so only nginx (which holds one) can speak to this service; and the
      # Postgres connection presents this service's own client certificate,
      # which pg_hba.conf requires. Material from scripts/dev/mkcerts.sh,
      # copied in by certs-init.
      - SIPHON_TLS_CERT=/etc/siphon/tls/tls.crt
      - SIPHON_TLS_KEY=/etc/siphon/tls/tls.key
      - SIPHON_TLS_CLIENT_CA=/etc/siphon/tls/ca.crt
      - SIPHON_DATABASE_URL=postgres://siphon@postgres:5432/siphon
      - SIPHON_DATABASE_PASSWORD=${SIPHON_DATABASE_PASSWORD:?Set SIPHON_DATABASE_PASSWORD; see deploy/.env.example}
      - SIPHON_DATABASE_TLS=mtls
      - SIPHON_DATABASE_CA_FILE=/etc/siphon/tls/ca.crt
      - SIPHON_DATABASE_CLIENT_CERT=/etc/siphon/tls/db-client.crt
      - SIPHON_DATABASE_CLIENT_KEY=/etc/siphon/tls/db-client.key
      # --- sensor objectives ----------------------------------------------
      # What the Running page judges each ACEE axis against. Empty = the
      # declared defaults; see deploy/.env.example.
      - SIPHON_SENSORS_TARGET_AVAILABILITY=${SIPHON_SENSORS_TARGET_AVAILABILITY:-}
      - SIPHON_SENSORS_TARGET_COVERAGE=${SIPHON_SENSORS_TARGET_COVERAGE:-}
      - SIPHON_SENSORS_TARGET_PRECISION=${SIPHON_SENSORS_TARGET_PRECISION:-}
      - SIPHON_SENSORS_TARGET_CANARY=${SIPHON_SENSORS_TARGET_CANARY:-}
      - SIPHON_SENSORS_EXPECTED=${SIPHON_SENSORS_EXPECTED:-}
      - RUST_LOG=info
    # The image runs as `siphon`, a system uid chosen at build time. The
    # certificate volume is owned by 1000 (what the Helm chart runs every
    # service as), so run as that here too.
    user: "1000:1000"
    volumes:
      - certs-api:/etc/siphon/tls:ro
    depends_on:
      certs-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    expose: ["8080"]
    restart: unless-stopped
    healthcheck:
      # The probe has to satisfy the listener's client-CA requirement, and
      # the service's own certificate carries clientAuth for exactly this.
      test: ["CMD", "curl", "-sf",
             "--cacert", "/etc/siphon/tls/ca.crt",
             "--cert", "/etc/siphon/tls/tls.crt", "--key", "/etc/siphon/tls/tls.key",
             "https://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  siphon-fs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.fs
    # Pinned per the per-crate SemVer rules in CLAUDE.md. Bump
    # in lockstep with crates/siphon-fs/Cargo.toml.
    image: siphon-fs:1.4.0
    profiles: [auth]
    environment:
      - SIPHON_FS_BIND=0.0.0.0:8081
      # Same shape as siphon-api, under its own prefix: this listener holds
      # its own identity and requires nginx's client certificate. Uploads
      # carry the data the scanner exists to find; they do not cross the
      # bridge network in the clear.
      - SIPHON_FS_TLS_CERT=/etc/siphon/tls/tls.crt
      - SIPHON_FS_TLS_KEY=/etc/siphon/tls/tls.key
      - SIPHON_FS_TLS_CLIENT_CA=/etc/siphon/tls/ca.crt
      - SIPHON_DATABASE_URL=postgres://siphon@postgres:5432/siphon
      - SIPHON_DATABASE_PASSWORD=${SIPHON_DATABASE_PASSWORD:?Set SIPHON_DATABASE_PASSWORD; see deploy/.env.example}
      - SIPHON_DATABASE_TLS=mtls
      - SIPHON_DATABASE_CA_FILE=/etc/siphon/tls/ca.crt
      - SIPHON_DATABASE_CLIENT_CERT=/etc/siphon/tls/db-client.crt
      - SIPHON_DATABASE_CLIENT_KEY=/etc/siphon/tls/db-client.key
      # --- telemetry: heartbeat to siphon-api over mTLS ---------------------
      # Needs a key with the Sensor role, issued once via POST /v1/keys and
      # put in deploy/.env. Unset = this sensor shows as "never seen" on the
      # Running page, which is the truth.
      - SIPHON_TELEMETRY_URL=https://siphon-api:8080
      - SIPHON_TELEMETRY_KEY=${SIPHON_TELEMETRY_KEY:-}
      - SIPHON_TELEMETRY_CA=/etc/siphon/tls/ca.crt
      - SIPHON_TELEMETRY_CLIENT_CERT=/etc/siphon/tls/tls.crt
      - SIPHON_TELEMETRY_CLIENT_KEY=/etc/siphon/tls/tls.key
      - RUST_LOG=info
    user: "1000:1000"
    volumes:
      - certs-fs:/etc/siphon/tls:ro
    depends_on:
      certs-init: { condition: service_completed_successfully }
      # siphon-api owns the schema; the milter and siphon-fs only write
      # into tables it created.
      siphon-api: { condition: service_healthy }
    expose: ["8081"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf",
             "--cacert", "/etc/siphon/tls/ca.crt",
             "--cert", "/etc/siphon/tls/tls.crt", "--key", "/etc/siphon/tls/tls.key",
             "https://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------------------
  # Internal PKI plumbing
  # -------------------------------------------------------------------------
  # Copies deploy/certs/ (from scripts/dev/mkcerts.sh) into one volume per
  # service, owned by the uid that service runs as. A bind mount cannot do
  # this: a private key is 0600 to the host user, and the containers are not
  # that user. Runs to completion before anything that needs a certificate.
  certs-init:
    image: alpine:3.20
    profiles: [auth]
    volumes:
      - ./certs:/src:ro
      - certs-api:/dst/siphon-api
      - certs-fs:/dst/siphon-fs
      - certs-smtp:/dst/siphon-smtp
      - certs-icap:/dst/siphon-icap
      - certs-nginx:/dst/nginx
      - certs-postgres:/dst/postgres
    command:
      - sh
      - -ec
      - |
        for d in siphon-api siphon-fs siphon-smtp siphon-icap nginx postgres; do
          [ -f "/src/$$d/ca.crt" ] || { echo "missing deploy/certs/$$d — run scripts/dev/mkcerts.sh first" >&2; exit 1; }
          rm -rf "/dst/$$d"/*
          cp "/src/$$d"/* "/dst/$$d/"
        done
        chown -R 1000:1000 /dst/siphon-api /dst/siphon-fs /dst/siphon-smtp /dst/siphon-icap
        chown -R 70:70 /dst/postgres     # postgres:*-alpine runs as uid 70
        chown -R 0:0   /dst/nginx        # nginx's master process reads the key as root
        chmod 600 /dst/*/*.key
        chmod 644 /dst/*/*.crt
        echo "certificates staged"

  # The findings store. Every network connection must be TLS with a client
  # certificate whose CN is the role AND the password — deploy/postgres/
  # pg_hba.conf. There is no plaintext listener to fall back to.
  postgres:
    image: postgres:17-alpine
    profiles: [auth]
    environment:
      - POSTGRES_DB=siphon
      - POSTGRES_USER=siphon
      - POSTGRES_PASSWORD=${SIPHON_DATABASE_PASSWORD:?Set SIPHON_DATABASE_PASSWORD; see deploy/.env.example}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgres/certs/tls.crt
      - -c
      - ssl_key_file=/etc/postgres/certs/tls.key
      - -c
      - ssl_ca_file=/etc/postgres/certs/ca.crt
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/postgres/pg_hba.conf
    volumes:
      - pg-data:/var/lib/postgresql/data
      - certs-postgres:/etc/postgres/certs:ro
      - ./postgres/pg_hba.conf:/etc/postgres/pg_hba.conf:ro
    depends_on:
      certs-init: { condition: service_completed_successfully }
    expose: ["5432"]
    restart: unless-stopped
    healthcheck:
      # Over the Unix socket, which pg_hba trusts and which nothing outside
      # the container can reach.
      test: ["CMD", "pg_isready", "-U", "siphon", "-d", "siphon"]
      interval: 10s
      timeout: 5s
      retries: 6

  authelia:
    image: authelia/authelia:4.38
    profiles: [auth]
    # Authelia runs as uid 1000 out of the box; mount the config
    # directory read-write so it can materialise db.sqlite3 and the
    # notification log next to the config it reads at startup.
    volumes:
      - ./authelia:/config
      - authelia-data:/config/runtime
    environment:
      # These three must be set in the shell or in a .env file before
      # `docker compose up` — there is no silent fallback. Generate with:
      #   export AUTHELIA_JWT_SECRET="$(openssl rand -hex 32)"
      #   export AUTHELIA_SESSION_SECRET="$(openssl rand -hex 32)"
      #   export AUTHELIA_STORAGE_ENCRYPTION_KEY="$(openssl rand -hex 32)"
      # The :? syntax fails compose immediately if any var is unset or
      # empty, preventing a stack that uses a known, repo-committed key.
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET:?Set AUTHELIA_JWT_SECRET (min 32 bytes); see deploy/.env.example}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET:?Set AUTHELIA_SESSION_SECRET (min 32 bytes); see deploy/.env.example}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY:?Set AUTHELIA_STORAGE_ENCRYPTION_KEY (min 32 bytes); see deploy/.env.example}
    expose: ["9091"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    build:
      # Repo root is the build context so the multi-stage Dockerfile
      # can see both `console/` (the SPA source) and `deploy/nginx/`
      # (the proxy config). Running `docker compose build` from the repo
      # root already resolves `..` correctly because the compose
      # file lives in deploy/.
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    image: siphon-nginx:latest
    profiles: [auth]
    ports:
      - "8080:80"
      # - "8443:443"  # enable once TLS certs are mounted
    # What nginx presents to siphon-api and siphon-fs, and the CA it verifies
    # them against — nginx.conf reads these paths.
    volumes:
      - certs-nginx:/etc/nginx/certs/internal:ro
    depends_on:
      certs-init: { condition: service_completed_successfully }
      authelia: { condition: service_healthy }
      siphon-api: { condition: service_healthy }
      siphon-fs: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

  siphon-icap:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.icap
    image: siphon-icap:0.2.0
    profiles: [auth]
    environment:
      # CIDRs whose connections the ICAP server accepts. Default is
      # loopback-only. For local dev widen to your proxy subnet, e.g.:
      #   SIPHON_ICAP_ALLOWED_NETS=10.0.0.0/8
      # NEVER use 0.0.0.0/0 on an internet-facing host — anyone can
      # feed the ICAP server arbitrary traffic with no authentication.
      - SIPHON_ICAP_ALLOWED_NETS=${SIPHON_ICAP_ALLOWED_NETS:-127.0.0.0/8}
      - SIPHON_ICAP_ACTION=${SIPHON_ICAP_ACTION:-flag}
      - SIPHON_ICAP_MIN_CONFIDENCE=${SIPHON_ICAP_MIN_CONFIDENCE:-0.6}
      # --- telemetry: heartbeat to siphon-api over mTLS ---------------------
      # Needs a key with the Sensor role, issued once via POST /v1/keys and
      # put in deploy/.env. Unset = this sensor shows as "never seen" on the
      # Running page, which is the truth.
      - SIPHON_TELEMETRY_URL=https://siphon-api:8080
      - SIPHON_TELEMETRY_KEY=${SIPHON_TELEMETRY_KEY:-}
      - SIPHON_TELEMETRY_CA=/etc/siphon/tls/ca.crt
      - SIPHON_TELEMETRY_CLIENT_CERT=/etc/siphon/tls/tls.crt
      - SIPHON_TELEMETRY_CLIENT_KEY=/etc/siphon/tls/tls.key
      - RUST_LOG=info
    user: "1000:1000"
    volumes:
      - certs-icap:/etc/siphon/tls:ro
    depends_on:
      certs-init: { condition: service_completed_successfully }
    expose: ["1344"]
    ports:
      - "1344:1344"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo -e 'OPTIONS icap://localhost:1344/dlp ICAP/1.0\\r\\nHost: localhost\\r\\nEncapsulated: null-body=0\\r\\n\\r\\n' | nc -q1 localhost 1344 | grep -q 'ICAP/1.0 200'"]
      interval: 30s
      timeout: 5s
      retries: 3

  siphon-smtp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.smtp
    image: siphon-smtp:0.2.0
    profiles: [auth]
    environment:
      # CIDRs whose connections the milter accepts. Default is loopback-
      # only. Widen to your MTA subnet for real Postfix integration, e.g.:
      #   SIPHON_SMTP_ALLOWED_NETS=10.0.0.0/8
      # NEVER use 0.0.0.0/0 on an internet-facing host — a mail filter
      # reachable from anywhere accepts arbitrary message injection.
      - SIPHON_SMTP_ALLOWED_NETS=${SIPHON_SMTP_ALLOWED_NETS:-127.0.0.0/8}
      # defer (fail closed, the default) | deliver (fail open).
      # `quarantine` is refused at startup: there is nowhere to hold a
      # message yet, and silently behaving as defer would replace the
      # operator's chosen failure direction with a different one.
      #
      # Whatever is set here, Postfix needs milter_default_action=tempfail
      # to match: the MTA gets the last word on a timeout, and a
      # disagreement between the two is a silent bypass.
      - SIPHON_SMTP_ON_INDETERMINATE=${SIPHON_SMTP_ON_INDETERMINATE:-defer}
      # 10 s, from the measurements in docs/architecture/email-dlp.md §4.5:
      # ~4x the worst contended message, ~40x the mixed-flow p99.
      - SIPHON_SMTP_TIMEOUT_SECS=${SIPHON_SMTP_TIMEOUT_SECS:-10}
      - SIPHON_SMTP_DIRECTION=${SIPHON_SMTP_DIRECTION:-inbound}
      - SIPHON_SMTP_MIN_CONFIDENCE=${SIPHON_SMTP_MIN_CONFIDENCE:-0.6}
      # Optional. Without it the milter still scans, decides and stamps;
      # what it loses is the retry guard and the investigation record.
      # siphon-api owns the migration runner, so bring that up first.
      - SIPHON_DATABASE_URL=postgres://siphon@postgres:5432/siphon
      - SIPHON_DATABASE_PASSWORD=${SIPHON_DATABASE_PASSWORD:?Set SIPHON_DATABASE_PASSWORD; see deploy/.env.example}
      # The milter's own client certificate to Postgres. Its MTA-facing side
      # stays a network allowlist: the milter protocol carries no TLS.
      - SIPHON_DATABASE_TLS=mtls
      - SIPHON_DATABASE_CA_FILE=/etc/siphon/tls/ca.crt
      - SIPHON_DATABASE_CLIENT_CERT=/etc/siphon/tls/db-client.crt
      - SIPHON_DATABASE_CLIENT_KEY=/etc/siphon/tls/db-client.key
      # --- telemetry: heartbeat to siphon-api over mTLS ---------------------
      # Needs a key with the Sensor role, issued once via POST /v1/keys and
      # put in deploy/.env. Unset = this sensor shows as "never seen" on the
      # Running page, which is the truth.
      - SIPHON_TELEMETRY_URL=https://siphon-api:8080
      - SIPHON_TELEMETRY_KEY=${SIPHON_TELEMETRY_KEY:-}
      - SIPHON_TELEMETRY_CA=/etc/siphon/tls/ca.crt
      - SIPHON_TELEMETRY_CLIENT_CERT=/etc/siphon/tls/tls.crt
      - SIPHON_TELEMETRY_CLIENT_KEY=/etc/siphon/tls/tls.key
      - RUST_LOG=info
    user: "1000:1000"
    volumes:
      - certs-smtp:/etc/siphon/tls:ro
    depends_on:
      certs-init: { condition: service_completed_successfully }
      siphon-api: { condition: service_healthy }
    expose: ["8894"]
    ports:
      - "8894:8894"
    restart: unless-stopped
    # No healthcheck. The milter protocol has no bare liveness probe — the
    # first thing a client must send is an option-negotiation packet, and
    # answering one would mean speaking the protocol from a shell. Compose
    # restarts the container if the process exits, which is the signal that
    # actually exists.

volumes:
  evadex-results:
  authelia-data:
  pg-data:
  # Per-service certificate volumes, populated by certs-init.
  certs-api:
  certs-fs:
  certs-smtp:
  certs-icap:
  certs-nginx:
  certs-postgres:

networks:
  default:
    name: siphon-net
