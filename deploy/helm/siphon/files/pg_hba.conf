# Client authentication for the Siphon database.
#
# Every network connection must be TLS AND present a client certificate
# signed by the deployment CA whose CN equals the connecting role — that is
# `clientcert=verify-full` — AND know the password. Certificate and password
# are independent factors: a leaked password is useless without a service's
# key, and a service's key is useless from a host that does not also hold
# the password. Mounted by deploy/docker-compose.yml and the Helm chart;
# the server-side certificate settings are passed as `-c` flags beside it.
#
# The CN requirement is why scripts/dev/mkcerts.sh issues every database
# client certificate with CN = the role (`siphon`), not the service name.
#
# TYPE      DATABASE  USER  ADDRESS     METHOD

# The Unix socket exists only inside the container: initdb, the image's
# entrypoint and pg_isready use it. Nothing can reach it over the network.
local       all       all               trust

# The only way in from the network.
hostssl     all       all   0.0.0.0/0   scram-sha-256  clientcert=verify-full
hostssl     all       all   ::/0        scram-sha-256  clientcert=verify-full

# Anything that is not TLS is refused before authentication is attempted, so
# a client with SIPHON_DATABASE_TLS=disable gets a clear "no pg_hba.conf
# entry" rather than a silent plaintext session.
hostnossl   all       all   all         reject
