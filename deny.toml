# cargo-deny configuration
# Run: cargo install cargo-deny && cargo deny check

# cargo-deny 0.19+ removed `vulnerability` and `notice` (advisories are
# treated as deny-by-default in schema v2; per-advisory carve-outs go
# through `ignore` below). See EmbarkStudios/cargo-deny#611 for the
# migration notes. `unmaintained` is still accepted and selects the
# scope (workspace | transitive | all | none) — kept at workspace
# because that's the surface we own and can act on.
[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0245 — sevenz-rust path traversal via `decompress_file`.
    # The vulnerability is in `decompress_impl`, which calls `dest.join(entry.name())`
    # without sanitising the entry name, allowing `../` sequences and absolute paths
    # to escape the extraction directory.
    #
    # Mitigation: `extract_7z` (src/extractors.rs) does NOT call `decompress_file`.
    # It drives extraction entry-by-entry via `decompress_file_with_extract_fn`,
    # routing every entry name through `sanitize_archive_path` before any write is
    # attempted — relative components are stripped, absolute paths are rejected, and
    # the resolved path is re-checked against the base directory. The regression test
    # in tests/archive_security_test.rs verifies that crafted traversal entries land
    # nowhere outside the temp directory.
    #
    # Long-term: migrate to `sevenz-rust2` (the advisory-recommended maintained
    # successor) when the extraction API surface is next touched. See BACKLOG.md.
    { id = "RUSTSEC-2026-0245", reason = "mitigated: extract_7z uses decompress_file_with_extract_fn + sanitize_archive_path; no unsafe write occurs. See tests/archive_security_test.rs." },

    # RUSTSEC-2026-0246 — sevenz-rust unmaintained.
    # Noted in BACKLOG.md; migration to sevenz-rust2 is the tracked follow-on work.
    # The traversal vulnerability (0245) is mitigated above; no known exploitable
    # issue remains in our controlled use of the API surface.
    { id = "RUSTSEC-2026-0246", reason = "unmaintained; tracked in BACKLOG.md for migration to sevenz-rust2. Traversal risk mitigated by custom extraction wrapper." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    # Apache-2.0 with the LLVM exception is its own SPDX expression
    # (not just "Apache-2.0"). Pulled by target-lexicon via
    # rav1e/system-deps in the rxing 0.8 image-decoder chain. Standard
    # OSI-approved exception; used by every LLVM-origin Rust crate.
    "Apache-2.0 WITH LLVM-exception",
    # NCSA (University of Illinois / NCSA Open Source License) —
    # permissive, OSI-approved, the license historically used by LLVM
    # itself. Pulled in transitively by libfuzzer-sys via rav1e in the
    # same image-decoder chain.
    "NCSA",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
