[package]
name = "siphon-auth"
version = "0.1.0"
edition = "2021"
description = "Polygon Siphon service identity — mutual TLS for the database and service hops"
license = "MIT"
rust-version = "1.98"

# A library, on the siphon-mail precedent: code that two or more binaries
# must agree on lives in one crate rather than being copied into each.
#
# Before this crate existed the Postgres TLS builder was three byte-identical
# copies — siphon-api, siphon-fs, siphon-smtp — every one ending in
# `.with_no_client_auth()`. That is three places to add client
# authentication and three places for one of them to be forgotten, and the
# one that is forgotten is the one that connects to the database
# unauthenticated while the other two claim the hop is mutual.
#
# Deliberately no siphon-core, no HTTP stack, no scanner: this crate answers
# "who is this service, and who is it talking to", nothing else. API-key
# resolution (docs/architecture/api-keys.md) lands here next, for the same
# reason: siphon-api and siphon-fs must resolve a bearer key identically.
[lib]
name = "siphon_auth"
path = "src/lib.rs"

[dependencies]
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = "1"
webpki-roots = "1.0.9"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tracing = "0.1"
# The key store: SHA-256 of the presented token, OS randomness for the
# secret, timestamps for expiry and rotation grace.
sha2 = "0.11"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Certificate validity, for the heartbeat's "days until this cert expires".
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
# The heartbeat wire shape; the receiver and every reporter share it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The reporting client. Optional: siphon-api only receives.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }

[features]
default = []
# `telemetry::reporter` — the HTTP client a sensor posts heartbeats with.
telemetry-client = ["dep:reqwest", "dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-rustls = "0.26"
tempfile = "3"
