[package]
name = "siphon-mail"
version = "0.2.0"
edition = "2021"
description = "Polygon Siphon mail model — message/part schema, persistence and verdict reconciliation"
license = "MIT"
rust-version = "1.98"

# A library, unlike every other crate in crates/. It exists because two
# binaries need the same model: siphon-smtp writes messages and parts,
# siphon-api reads them back. siphon-api has no lib target to depend on, and
# giving it one would link its entire axum/tower HTTP stack into a milter
# that never serves HTTP.
#
# So the mail model lives here, owning both its DDL (migrations/, exported as
# MIGRATION_SQL) and its DML. siphon-api still runs the migration — it owns
# the migration runner and the ordering — but the schema and the statements
# that depend on it stay in one crate rather than drifting apart.
[lib]
name = "siphon_mail"
path = "src/lib.rs"

[dependencies]
# No HTTP stack: this crate is the message model, not a service. It used to
# carry no siphon-core either, on the grounds that it is not a scanner — and
# it still is not one. siphon-core is where the shared `Inspection` type
# lives, by design (docs/architecture/inspection-outcome.md): one answer to
# "did the verdict cover everything?" for every ingress, so a mail filter, a
# proxy and the CLI cannot drift apart on what "clean" is allowed to mean.
# Every consumer of this crate (siphon-smtp, siphon-api) already links
# siphon-core, and it has no default features, so nothing new reaches them.
siphon-core = { path = "../siphon-core" }
tokio-postgres = { version = "0.7", features = [
    "with-uuid-1",
    "with-chrono-0_4",
] }
deadpool-postgres = "0.14"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
# For the test that pins each `PartStatus` to its `Unread` kind by the
# serde tag, which is the one stable name a variant has outside siphon-core.
serde_json = "1.0"
